format = "$cmd_duration$all$line_break$battery$jobs$status$os$container$netns$shell$character"
[battery]
charging_symbol = "󰂄"
discharging_symbol = "󰂃"
empty_symbol = "󰂎"
full_symbol = "󰁹"
unknown_symbol = "󰁽"

[[battery.display]]
style = "bold red"
threshold = 10

[[battery.display]]
style = "bold yellow"
threshold = 30

[[battery.display]]
style = "bold green"
threshold = 100

[c]
format = "[$symbol$version(-$name)]($style) "
symbol = " "
version_format = "$raw"

[character]
error_symbol = "[❯](bold #ff5555)"
success_symbol = "[❯](bold #50fa7b)"

[cmd_duration]
format = "took [$duration]($style)\n"
show_milliseconds = true
style = "bold #f1fa8c"

[custom.efr]
command = "cat .ACMEROOT/EFR"
detect_folders = [".ACMEROOT"]
format = "[$output]($style) "
style = "bold #50fa7b"

[custom.xr_version]
command = "awk '/XR_LABEL/ { gsub(/[\\[\\]]/,\"\", $3); print $3 }' package/version_labels/src/version_labels.txt"
detect_folders = [".ACMEROOT"]
format = "[$output]($style) "
style = "bold #50fa7b"

[directory]
fish_style_pwd_dir_length = 1
style = "bold #50fa7b"
truncation_length = 1

[git_branch]
format = "[$symbol $branch(:$remote_branch)]($style) "
style = "bold #ff79c6"
symbol = ""

[git_status]
ahead = "$count"
behind = "$count"
conflicted = "✘"
deleted = "󱘹"
diverged = "$ahead_count$behind_count"
modified = "✚"
renamed = "»"
staged = "●"
stashed = ""
style = "bold #FFB86C"
untracked = "…"
up_to_date = ""

[hostname]
format = "[$hostname]($style):"
ssh_only = false
style = "bold #bd93f9"

[nix_shell]
format = "[$symbol$state]($style) "
impure_msg = "󰋮"
pure_msg = "󰻿"
symbol = " "

[nodejs]
format = "[$symbol$version]($style) "
symbol = "󰎙 "
version_format = "$raw"

[os]
disabled = false
format = "[$symbol]($style) "

[os.symbols]
Linux = ""
Macos = ""
NixOS = ""
Raspbian = ""
RedHatEnterprise = "󱄛"
Redhat = "󱄛"
Ubuntu = ""
Unknown = ""
Windows = ""

[package]
format = "[$symbol$version]($style) "
symbol = "󰏗 "
version_format = "$raw"

[python]
format = "[$symbol$version]($style) "
symbol = "󰌠 "
version_format = "$raw"

[rust]
format = "[$symbol$version]($style) "
symbol = "󱘗 "
version_format = "$raw"

[shell]
bash_indicator = "󰣪"
disabled = false
fish_indicator = "󰈺"

[username]
format = "[$user]($style)@"
show_always = true
style_root = "bold #ff5555"
style_user = "bold #bd93f9"

[container]
symbol = " "
style = "blue"
disabled = false
format = "[$symbol]($style)"
